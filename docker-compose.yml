services:
  # ==============================================================================
  # 1. DATABASE SERVICE (PostgreSQL 15 - Internal Network Only) (Tahap 13, 14, 15)
  # ==============================================================================
  vms-postgres:
    image: postgres:15-alpine
    container_name: vms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vms_cemindo_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-vms_batam}
    # Note: Host port mapping omitted intentionally for security (Tahap 14 & 15).
    # Accessible only within the internal Docker bridge network.
    volumes:
      - vms_postgres_data:/var/lib/postgresql/data
    networks:
      - vms_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vms_user} -d ${POSTGRES_DB:-vms_batam}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==============================================================================
  # 2. CACHE & MESSAGE BROKER (Redis 7) (Tahap 14)
  # ==============================================================================
  vms-redis:
    image: redis:7-alpine
    container_name: vms-redis
    restart: unless-stopped
    volumes:
      - vms_redis_data:/data
    networks:
      - vms_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==============================================================================
  # 3. DEDICATED WHATSAPP BAILEYS SERVICE (Tahap 14: Terpisah dari Backend)
  # ==============================================================================
  vms-whatsapp-service:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    container_name: vms-whatsapp-service
    restart: unless-stopped
    environment:
      PORT: 5001
      WA_AUTH_PATH: /app/baileys_auth
      NODE_ENV: production
    volumes:
      - vms_wa_auth:/app/baileys_auth
    networks:
      - vms_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==============================================================================
  # 4. BULLMQ NOTIFICATION QUEUE WORKER (Tahap 14)
  # ==============================================================================
  vms-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: vms-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vms_user}:${POSTGRES_PASSWORD:-vms_cemindo_2026!}@vms-postgres:5432/${POSTGRES_DB:-vms_batam}?schema=public
      REDIS_HOST: vms-redis
      REDIS_PORT: 6379
      WA_SERVICE_URL: http://vms-whatsapp-service:5001
      NODE_ENV: production
    depends_on:
      vms-postgres:
        condition: service_healthy
      vms-redis:
        condition: service_healthy
      vms-whatsapp-service:
        condition: service_healthy
    networks:
      - vms_internal

  # ==============================================================================
  # 5. BACKEND REST API SERVICE (Node.js, Express, Prisma ORM) (Tahap 13, 14, 15)
  # ==============================================================================
  vms-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vms-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vms_user}:${POSTGRES_PASSWORD:-vms_cemindo_2026!}@vms-postgres:5432/${POSTGRES_DB:-vms_batam}?schema=public
      REDIS_HOST: vms-redis
      REDIS_PORT: 6379
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-cemindo-gemilang-batam-plant-vms-secret-jwt-key-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      WA_SERVICE_URL: http://vms-whatsapp-service:5001
      WA_AUTH_PATH: /app/baileys_auth
    volumes:
      - vms_wa_auth:/app/baileys_auth
    depends_on:
      vms-postgres:
        condition: service_healthy
      vms-redis:
        condition: service_healthy
      vms-whatsapp-service:
        condition: service_healthy
    networks:
      - vms_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==============================================================================
  # 6. FRONTEND SINGLE PAGE APPLICATION (React, Vite, Tailwind CSS) (Tahap 14)
  # ==============================================================================
  vms-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vms-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - vms-backend
    networks:
      - vms_internal

  # ==============================================================================
  # 7. NGINX MASTER REVERSE PROXY GATEWAY (Tahap 14 & 15: Subpath & SSL Ready)
  # ==============================================================================
  vms-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: vms-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - vms-frontend
      - vms-backend
    networks:
      - vms_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

# ==============================================================================
# PERMANENT VOLUMES (Tahap 14)
# ==============================================================================
volumes:
  vms_postgres_data:
    name: vms_postgres_data
  vms_redis_data:
    name: vms_redis_data
  vms_wa_auth:
    name: vms_wa_auth

# ==============================================================================
# NETWORKS (Tahap 14 & 15: Internal Network Isolation)
# ==============================================================================
networks:
  vms_internal:
    name: vms_internal
    driver: bridge
