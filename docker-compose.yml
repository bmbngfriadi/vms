services:
  postgres:
    image: postgres:15-alpine
    container_name: vms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vms_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-vms_batam}
    volumes:
      - vms_pgdata:/var/lib/postgresql/data
    networks:
      vms_net:
        aliases:
          - postgres
          - vms-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vms_user} -d ${POSTGRES_DB:-vms_batam}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    container_name: vms-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vms_user}:${POSTGRES_PASSWORD:-vms_secret_change_me}@postgres:5432/${POSTGRES_DB:-vms_batam}?schema=public
      NODE_ENV: production
      PORT: 5000
      TZ: Asia/Jakarta
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WA_AUTH_PATH: /app/wa_auth
      RUN_SEED: ${RUN_SEED:-true}
    # Backend cukup diakses via network internal oleh container app.
    # Jika butuh akses langsung dari host, gunakan port 5001
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5001}:5000"
    volumes:
      - vms_wa_auth:/app/wa_auth
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vms_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: ./frontend
    container_name: vms-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VMS_PORT:-5177}:80"
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vms_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  vms_pgdata:
  vms_wa_auth:

networks:
  vms_net:
    driver: bridge
