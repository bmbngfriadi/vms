<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft App Icon Drop Shadow -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
    </filter>

    <!-- Subtle Inner Gradient for White Tile -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Kiosk Body Gradient -->
    <linearGradient id="kioskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Screen Bezel Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Cemindo Red Accent Gradient -->
    <linearGradient id="vmsRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Red Screen Ambient Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. PWA App Icon Tile: Crisp White Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tileGrad)" stroke="#e2e8f0" stroke-width="4" filter="url(#tileShadow)" />

  <!-- 2. Kiosk Station Base Plate (Sturdy Horizontal Pedestal) -->
  <path d="M 120 408 L 380 408 C 386 408 390 412 390 418 L 390 422 C 390 426 386 428 380 428 L 120 428 C 114 428 110 426 110 422 L 110 418 C 110 412 114 408 120 408 Z" fill="#1e293b" />

  <!-- 3. Main Kiosk Terminal Body (Vertical Cabinet) -->
  <!-- Chamfered / Slanted Modern Head Silhouette -->
  <path d="
    M 152 408 
    L 152 140 
    Q 152 108 184 104 
    L 300 92 
    Q 326 90 326 116 
    L 326 408 
    Z" 
    fill="url(#kioskGrad)" 
    stroke="#1e293b" 
    stroke-width="14" 
    stroke-linejoin="round" 
    stroke-linecap="round" 
  />

  <!-- Top Accent Cap / Status Bezel -->
  <path d="M 156 142 L 322 125" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

  <!-- 4. Interactive Scanner Display Screen -->
  <rect x="180" y="148" width="118" height="168" rx="16" fill="url(#screenGrad)" stroke="#334155" stroke-width="6" />
  <rect x="180" y="148" width="118" height="168" rx="16" fill="url(#screenGlow)" />

  <!-- 5. Central VMS Emblem: Bold Red Visitor Pass & QR / Scan Glyph -->
  <!-- Stylized Visitor Card & Smart QR Scan in Cemindo Red -->
  <g transform="translate(239, 232)">
    <!-- ID Card Silhouette / Shield Outline -->
    <path d="M -30 -52 L 30 -52 C 36 -52 40 -48 40 -42 L 40 40 C 40 46 36 50 30 50 L -30 50 C -36 50 -40 46 -40 40 L -40 -42 C -40 -48 -36 -52 -30 -52 Z" 
          fill="none" stroke="url(#vmsRed)" stroke-width="7" stroke-linejoin="round" />

    <!-- Lanyard / Badge Clip Slot -->
    <rect x="-14" y="-47" width="28" height="6" rx="3" fill="url(#vmsRed)" />

    <!-- QR Matrix Finder Corners inside Badge -->
    <!-- Top-Left Target -->
    <rect x="-28" y="-32" width="18" height="18" rx="3" fill="url(#vmsRed)" />
    <rect x="-24" y="-28" width="10" height="10" rx="1.5" fill="#ffffff" />
    <rect x="-21" y="-25" width="4" height="4" fill="url(#vmsRed)" />

    <!-- Top-Right Target -->
    <rect x="10" y="-32" width="18" height="18" rx="3" fill="url(#vmsRed)" />
    <rect x="14" y="-28" width="10" height="10" rx="1.5" fill="#ffffff" />
    <rect x="17" y="-25" width="4" height="4" fill="url(#vmsRed)" />

    <!-- Bottom-Left Target -->
    <rect x="-28" y="12" width="18" height="18" rx="3" fill="url(#vmsRed)" />
    <rect x="-24" y="16" width="10" height="10" rx="1.5" fill="#ffffff" />
    <rect x="-21" y="19" width="4" height="4" fill="url(#vmsRed)" />

    <!-- Bottom-Right Smart Chip / Wave -->
    <rect x="12" y="14" width="14" height="14" rx="2" fill="url(#vmsRed)" />

    <!-- Laser Scan Beam Across the Screen -->
    <line x1="-38" y1="-2" x2="38" y2="-2" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="-2" r="3" fill="#ffffff" />
  </g>

  <!-- 6. Indicator Status Lights (Green Check & Red Scan) -->
  <circle cx="218" cy="344" r="6" fill="#10b981" stroke="#047857" stroke-width="1.5" />
  <circle cx="260" cy="344" r="6" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />

  <!-- 7. Ticket / Thermal Pass Print Dispenser Slot -->
  <rect x="194" y="366" width="90" height="9" rx="4.5" fill="#1e293b" />
  <line x1="204" y1="384" x2="274" y2="384" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

  <!-- 8. Side Handheld Barcode Scanner / Docked Unit (Matching User Reference Image!) -->
  <!-- Docking Bracket on Kiosk Right Wall -->
  <rect x="326" y="184" width="16" height="34" rx="4" fill="#334155" stroke="#1e293b" stroke-width="3" />

  <!-- Handheld Scanner Head & Grip -->
  <!-- Scanner Head -->
  <path d="M 342 168 L 368 160 C 374 158 380 162 381 168 L 385 194 C 386 200 382 206 376 208 L 350 216 Z" 
        fill="#f8fafc" stroke="#1e293b" stroke-width="11" stroke-linejoin="round" />
  <!-- Scanner Window (Red Glass Sensor) -->
  <path d="M 370 166 L 379 198" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />

  <!-- Scanner Handle / Wand -->
  <path d="M 352 216 L 348 268 C 347 274 352 280 358 281 L 366 282 C 372 283 377 278 378 272 L 382 210" 
        fill="#ffffff" stroke="#1e293b" stroke-width="11" stroke-linejoin="round" />

  <!-- Coiled Industrial Cable (Connecting Scanner to Kiosk Base) -->
  <path d="
    M 363 282 
    C 368 318, 396 324, 388 358 
    C 382 386, 350 388, 332 376 
    C 324 371, 326 360, 326 352" 
    fill="none" 
    stroke="#1e293b" 
    stroke-width="10" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
</svg>
