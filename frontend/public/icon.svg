<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Red Cemindo Ambient Glow -->
    <radialGradient id="redGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Cemindo Red Banner Gradient -->
    <linearGradient id="redBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Metal Clip Gradient -->
    <linearGradient id="metalClip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Shield Badge Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Metallic Bezel Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Filters for Soft Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <clipPath id="cardClip">
      <rect x="106" y="105" width="300" height="360" rx="24" />
    </clipPath>
    <clipPath id="photoClip">
      <rect x="130" y="203" width="90" height="100" rx="12" />
    </clipPath>
  </defs>

  <!-- 1. Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#redGlow)" />

  <!-- 2. Lanyard Straps -->
  <path d="M 170 16 L 240 98" stroke="#b91c1c" stroke-width="17" stroke-linecap="round" />
  <path d="M 170 16 L 240 98" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" />
  <path d="M 342 16 L 272 98" stroke="#b91c1c" stroke-width="17" stroke-linecap="round" />
  <path d="M 342 16 L 272 98" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" />

  <!-- Metal Buckle / Clip -->
  <rect x="234" y="89" width="44" height="22" rx="7" fill="url(#metalClip)" stroke="#334155" stroke-width="1.5" />
  <ellipse cx="256" cy="98" rx="8" ry="4" fill="#0f172a" />

  <!-- 3. Visitor ID Card Pass -->
  <rect x="106" y="105" width="300" height="360" rx="24" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Lanyard Slot Hole in Card -->
  <rect x="234" y="113" width="44" height="9" rx="4.5" fill="#0f172a" />

  <!-- Card Content (Clipped) -->
  <g clip-path="url(#cardClip)">
    <!-- Red Cemindo Header Banner -->
    <rect x="106" y="132" width="300" height="68" fill="url(#redBanner)" />
    <line x1="106" y1="142" x2="406" y2="142" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
    <line x1="106" y1="190" x2="406" y2="190" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />

    <text x="256" y="157" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="16" letter-spacing="1.5" text-anchor="middle">VISITOR PASS</text>
    <text x="256" y="181" fill="#fecaca" font-family="Arial, sans-serif" font-weight="700" font-size="8.5" letter-spacing="0.8" text-anchor="middle">PT CEMINDO GEMILANG TBK</text>
  </g>

  <!-- 4. Visitor Photo / Identity Box -->
  <rect x="130" y="215" width="90" height="100" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  
  <g clip-path="url(#photoClip)">
    <!-- Avatar silhouette -->
    <circle cx="175" cy="249" r="18" fill="#64748b" />
    <ellipse cx="175" cy="292" rx="38" ry="26" fill="#475569" />
    <!-- Red Cemindo Accent Tie -->
    <polygon points="175,275 168,291 175,305 182,291" fill="#b91c1c" />
  </g>

  <!-- 5. Guest Information Bars -->
  <!-- Name Pill -->
  <rect x="235" y="221" width="135" height="12" rx="6" fill="#b91c1c" />
  <!-- Company Bar -->
  <rect x="235" y="243" width="110" height="9" rx="4.5" fill="#475569" />
  <!-- Destination Bar -->
  <rect x="235" y="259" width="122" height="8" rx="4" fill="#94a3b8" />
  <!-- Date / Pass Bar -->
  <rect x="235" y="274" width="85" height="7" rx="3.5" fill="#cbd5e1" />

  <!-- Validated Status Chip -->
  <rect x="235" y="290" width="65" height="18" rx="9" fill="#fee2e2" stroke="#f87171" stroke-width="1" />
  <text x="267" y="302" fill="#b91c1c" font-family="Arial, sans-serif" font-weight="800" font-size="7" letter-spacing="0.5" text-anchor="middle">VALIDATED</text>

  <!-- 6. Divider Line -->
  <line x1="126" y1="332" x2="386" y2="332" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- 7. Barcode Lines -->
  <g fill="#1e293b">
    <rect x="130" y="347" width="3.5" height="38" fill="#b91c1c" />
    <rect x="136" y="347" width="2" height="38" />
    <rect x="140" y="347" width="6" height="38" fill="#b91c1c" />
    <rect x="148" y="347" width="2.5" height="38" />
    <rect x="153" y="347" width="4" height="38" fill="#b91c1c" />
    <rect x="160" y="347" width="7" height="38" />
    <rect x="170" y="347" width="3" height="38" fill="#b91c1c" />
    <rect x="175" y="347" width="5" height="38" />
    <rect x="182" y="347" width="2" height="38" fill="#b91c1c" />
    <rect x="186" y="347" width="6" height="38" />
    <rect x="194" y="347" width="4" height="38" fill="#b91c1c" />
    <rect x="200" y="347" width="3" height="38" />
    <rect x="205" y="347" width="7.5" height="38" fill="#b91c1c" />
    <rect x="215" y="347" width="2.5" height="38" />
    <rect x="220" y="347" width="4.5" height="38" fill="#b91c1c" />
    <rect x="227" y="347" width="5.5" height="38" />
    <rect x="235" y="347" width="3" height="38" fill="#b91c1c" />
    <rect x="240" y="347" width="6.5" height="38" />
    <rect x="249" y="347" width="3.5" height="38" fill="#b91c1c" />
    <rect x="255" y="347" width="4" height="38" />
    <rect x="261" y="347" width="7" height="38" fill="#b91c1c" />
    <rect x="270" y="347" width="2.5" height="38" />
    <rect x="275" y="347" width="5" height="38" fill="#b91c1c" />
    <rect x="282" y="347" width="2" height="38" />
    <rect x="286" y="347" width="6" height="38" fill="#b91c1c" />
    <rect x="294" y="347" width="3" height="38" />
    <rect x="299" y="347" width="4" height="38" fill="#b91c1c" />
    <rect x="305" y="347" width="5" height="38" />
  </g>
  <text x="203" y="396" fill="#64748b" font-family="Courier, monospace" font-weight="700" font-size="7.5" text-anchor="middle">* VMS-CEMINDO-BATAM-2026 *</text>

  <!-- 8. Floating Security Shield Emblem (Bottom Right) -->
  <g filter="url(#badgeShadow)">
    <circle cx="382" cy="436" r="40" fill="url(#bezelGrad)" />
    <circle cx="382" cy="436" r="35" fill="url(#shieldGrad)" />
    <!-- Checkmark -->
    <path d="M 365 437 L 377 449 L 399 423" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

