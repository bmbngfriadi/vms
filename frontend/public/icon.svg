<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft App Icon Drop Shadow -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.10" />
    </filter>

    <!-- Subtle Inner Gradient for Clean White Tile -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Red Laser Beam Glow -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2" />
      <stop offset="15%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="85%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Glow Filter for Red Laser -->
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Crisp White Squircle Tile (PWA App Icon Background) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tileGrad)" stroke="#e2e8f0" stroke-width="4" filter="url(#tileShadow)" />

  <!-- 2. Barcode Scan Viewfinder (4 Corner Brackets) -->
  <g fill="none" stroke="#1e293b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left Corner Bracket -->
    <path d="M 170 110 L 130 110 A 20 20 0 0 0 110 130 L 110 170" />
    <!-- Top-Right Corner Bracket -->
    <path d="M 342 110 L 382 110 A 20 20 0 0 1 402 130 L 402 170" />
    <!-- Bottom-Left Corner Bracket -->
    <path d="M 110 342 L 110 382 A 20 20 0 0 0 130 402 L 170 402" />
    <!-- Bottom-Right Corner Bracket -->
    <path d="M 402 342 L 402 382 A 20 20 0 0 1 382 402 L 342 402" />
  </g>

  <!-- 3. Vertical Barcode Bars (Crisp Industrial Charcoal Rhythm) -->
  <g fill="#1e293b">
    <!-- Bar 1 (Thick) -->
    <rect x="145" y="150" width="12" height="212" rx="4" />
    <!-- Bar 2 (Thin) -->
    <rect x="165" y="150" width="5" height="212" rx="2.5" />
    <!-- Bar 3 (Medium) -->
    <rect x="178" y="150" width="8" height="212" rx="3" />
    <!-- Bar 4 (Thick) -->
    <rect x="196" y="150" width="13" height="212" rx="4" />
    <!-- Bar 5 (Thin) -->
    <rect x="217" y="150" width="5" height="212" rx="2.5" />
    <!-- Bar 6 (Medium) -->
    <rect x="230" y="150" width="9" height="212" rx="3.5" />
    <!-- Bar 7 (Thin) -->
    <rect x="247" y="150" width="5" height="212" rx="2.5" />
    <!-- Bar 8 (Thick) -->
    <rect x="260" y="150" width="13" height="212" rx="4" />
    <!-- Bar 9 (Thin) -->
    <rect x="281" y="150" width="5" height="212" rx="2.5" />
    <!-- Bar 10 (Medium) -->
    <rect x="294" y="150" width="8" height="212" rx="3" />
    <!-- Bar 11 (Thick) -->
    <rect x="310" y="150" width="12" height="212" rx="4" />
    <!-- Bar 12 (Thin) -->
    <rect x="330" y="150" width="5" height="212" rx="2.5" />
    <!-- Bar 13 (Medium) -->
    <rect x="343" y="150" width="9" height="212" rx="3.5" />
    <!-- Bar 14 (Thick) -->
    <rect x="360" y="150" width="11" height="212" rx="4" />
  </g>

  <!-- 4. Dynamic Red Laser Scan Beam Across the Center (Cemindo Red #dc2626) -->
  <!-- Ambient Soft Red Glow -->
  <line x1="90" y1="256" x2="422" y2="256" stroke="#ef4444" stroke-width="16" stroke-opacity="0.3" stroke-linecap="round" />
  
  <!-- Sharp Vibrant Core Laser Beam -->
  <line x1="90" y1="256" x2="422" y2="256" stroke="url(#laserGrad)" stroke-width="8" stroke-linecap="round" filter="url(#laserGlow)" />

  <!-- Center Laser Energy Core Flare (White Hot Line) -->
  <line x1="180" y1="256" x2="332" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="256" cy="256" r="4.5" fill="#ffffff" />
</svg>
